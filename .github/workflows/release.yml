name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Don't burn a patch release on changes that can't affect the APK.
    paths-ignore:
      - '**/*.md'
      - 'website/**'
      - 'reference/**'
      - '.githooks/**'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: write

# Serialize rather than cancel: two concurrent runs would read the same version from
# gradle.properties and both try to release it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          # Exact version, not '1.24': the Go compiler is part of the APK's bytes, so F-Droid's
          # reproducible build must use the same one (its recipe pins go@go1.24.13 to match).
          go-version: '1.24.13'
          cache: true
          cache-dependency-path: core/go.sum

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Read the version
        id: version
        env:
          # A branch push re-releasing an already-tagged version is not an error — main
          # moves on every merge, most of which don't bump the version. A manual dispatch
          # doing the same means someone forgot to bump it, so that case should fail loud.
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # gradle.properties is the only place the version is set; F-Droid's checkupdates
          # reads the same lines at each tag. Refuse to re-release a version, so a
          # forgotten bump fails here instead of overwriting nothing and confusing later.
          VERSION=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Cannot parse VERSION_NAME: '$VERSION'" >&2; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            if [ "$EVENT_NAME" = push ]; then
              echo "::notice::v$VERSION is already released; nothing to do for this push."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "v$VERSION is already released. Bump VERSION_NAME and VERSION_CODE in gradle.properties first." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Build Go core for Android ABIs
        if: steps.version.outputs.release == 'true'
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          # -buildvcs=false keeps git state out of the binary. Otherwise it embeds a pseudo-version
          # computed before this release's tag exists, plus a dirty flag, and no later rebuild
          # (F-Droid's included) can reproduce the APK byte for byte.
          LDFLAGS="-s -w -X main.version=${VERSION}"
          build_abi() {
            local goarch="$1" goarm="$2" abi="$3"
            local out="app/src/main/jniLibs/${abi}/libparvaz.so"
            mkdir -p "$(dirname "$out")"
            echo ">> android/${goarch}${goarm:+-v$goarm} → ${abi}"
            # `env` so the conditional ${goarm:+GOARM=$goarm} gets treated as
            # an env-var assignment after expansion. In a bare KEY=VAL cmd
            # invocation bash decides at PARSE time which leading words are
            # assignments, before expansion runs — so the expanded
            # GOARM=7 landed in command position and bash exec'd it as the
            # command name (exit 127 "command not found").
            env GOOS=android GOARCH="$goarch" ${goarm:+GOARM="$goarm"} \
                go build -C core -trimpath -buildvcs=false -ldflags "$LDFLAGS" \
                -o "../$out" ./cmd/parvazd
          }
          # arm64-v8a is the only ABI that links without cgo — gvisor /
          # tun2socks syscall paths need external linking on android/arm,
          # android/amd64, and android/386. Adding NDK clang to CI is a
          # separate task; modern Android phones (≥API 24) are ~all arm64,
          # so v0.1.0 ships arm64 only. Emulator users can cross-build
          # x86_64 locally with NDK.
          build_abi arm64 "" arm64-v8a

      - name: Verify signing secrets
        if: steps.version.outputs.release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          missing=""
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            eval "val=\${$v:-}"
            [ -z "$val" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "Missing required signing secret(s):$missing" >&2
            echo "Set them at Settings → Secrets and variables → Actions" >&2
            exit 1
          fi

      - name: Decode keystore
        if: steps.version.outputs.release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build signed release APK
        if: steps.version.outputs.release == 'true'
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK to stable filename
        if: steps.version.outputs.release == 'true'
        run: |
          set -eu
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Parvaz.apk"
          ( cd dist && sha256sum "Parvaz.apk" > "Parvaz.apk.sha256" )

      - name: Tag and push
        if: steps.version.outputs.release == 'true'
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "github-actions[bot]"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Parvaz ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/Parvaz.apk
            dist/Parvaz.apk.sha256
